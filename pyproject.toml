[project]
name = "slp"
version = "0.1.0"
description = "Spoken Language Processing Toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.5.0",
    "evaluate>=0.4.6",
    "hydra-core>=1.3.2",
    "jiwer>=4.0.0",
    "numba>=0.63.1",
    "openai-whisper>=20250625",
    "peft>=0.18.1",
    "phonemizer>=3.3.0",
    "sacrebleu>=2.6.0",
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchcodec~=0.7.0",
    "tqdm>=4.67.2",
    "transformers>=5.1.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchaudio = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E203",  # flake8 + black
    "W191", "E111", "E114", "E117",  # formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_missing_imports = true
